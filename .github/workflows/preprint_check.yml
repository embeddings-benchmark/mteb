name: Cited preprints published
on:
  schedule:
    - cron: "0 5 1 * *"  # monthly, after the citation check
  workflow_dispatch:

jobs:
  preprint-check:
    # forks would otherwise open issues on their own repository
    if: github.repository == 'embeddings-benchmark/mteb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --group test --frozen

    # The script exits with 1 both when it finds published preprints and when it
    # crashes; only the first writes the report.
    - name: Check whether cited preprints have been published
      id: check
      run: |
        if ! make preprint-check PREPRINT_CHECK_ARGS="--report preprints.md"; then
          test -s preprints.md
          cat preprints.md >> "$GITHUB_STEP_SUMMARY"
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload the report
      if: steps.check.outputs.found == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: preprints
        path: preprints.md
        retention-days: 1

  # A separate job, so the token that can open issues never shares a runner with
  # the dependencies the check installs and runs.
  report-preprints:
    needs: preprint-check
    if: needs.preprint-check.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Download the report
      uses: actions/download-artifact@v8
      with:
        name: preprints

    - name: Open or update the issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        title="Cited preprints that have since been published"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        printf '\nFound by %s.\n' "$run_url" >> preprints.md

        number=$(gh issue list --state open --search "\"$title\" in:title" \
          --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
        if [[ -n "$number" ]]; then
          gh issue edit "$number" --body-file preprints.md
        else
          gh issue create --title "$title" --body-file preprints.md
        fi
