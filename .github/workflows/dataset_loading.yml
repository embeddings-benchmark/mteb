name: Datasets available on HuggingFace
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "mteb/tasks/**.py"
      - ".github/workflows/dataset_loading.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  dataset-loading-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
        version: "0.10.12"
        python-version: '3.10'

    - name: Diagnose venv creation
      timeout-minutes: 5
      run: |
        set -euxo pipefail
        uv python install 3.10
        PYTHON="$(uv python find 3.10)"
        "$PYTHON" --version
        timeout 120s "$PYTHON" -m venv /tmp/stdlib-venv
        /tmp/stdlib-venv/bin/python --version
        timeout 120s uv venv /tmp/uv-venv --python "$PYTHON" -vv

    - name: Install dependencies
      timeout-minutes: 10
      run: |
        rm -rf .venv
        "$(uv python find 3.10)" -m venv .venv
        uv sync --group test --frozen --verbose

    - name: Run dataset loading tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          make dataset-load-test-pr BASE_BRANCH=${{ github.event.pull_request.base.ref }}
        else
          make dataset-load-test
        fi
