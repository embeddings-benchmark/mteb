name: Check PR description length

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-description-length:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MAX_LENGTH: 2000
    steps:
      - name: Check description length and close if too long
        run: |
          length=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body | length')
          echo "Description length: $length"

          if [ "$length" -le "$MAX_LENGTH" ]; then
            echo "Description within limit, nothing to do."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          This pull request description is marked as long, $length characters exceeding the $MAX_LENGTH limit.

          This is usually a sign that the description is too verbose and e.g. due to being auto-generated. This poses undue strain on our contributors. Please reduce the length of the comment. Reviewers are free to close long PRs with providing a reason.

          See our [contributing guidelines](https://github.com/embeddings-benchmark/mteb/blob/main/docs/CONTRIBUTING.md#pull-requests) for details on what a good PR description should contain.
          EOF
          )"

          gh pr close "$PR_NUMBER" --repo "$REPO"
