name: Cited works exist
on:
  pull_request:
    paths:
      - "mteb/tasks/**.py"
      - "mteb/benchmarks/**.py"
      - "mteb/models/**.py"
      - "tests/test_validate_metadata/**"
      - ".github/workflows/citation_check.yml"
  push:
    branches: [main]
    paths:
      - "mteb/tasks/**.py"
      - "mteb/benchmarks/**.py"
      - "mteb/models/**.py"
      - "tests/test_validate_metadata/**"
      - ".github/workflows/citation_check.yml"
  schedule:
    - cron: "0 4 1 * *"  # monthly, citations are only re-checked every 30 days
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  citation-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to commit the refreshed cache on main
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
        version: "0.10.12"
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --group test --frozen

    - name: Check citations
      run: make citation-check

    # a pull request only reports; once it lands, keep what the run looked up so that
    # later runs start from it. `always()` keeps those results even when the check found
    # something to report.
    - name: Commit the citation cache
      if: always() && github.ref == 'refs/heads/main'
      run: |
        if ! git diff --quiet tests/test_validate_metadata/citation_cache.json; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_validate_metadata/citation_cache.json
          git commit -m "chore: update the citation cache"
          git push origin HEAD:main
        fi
